[install]
# Corporate proxy CA certificates (e.g. Zscaler MITM) must NOT be configured
# here: bun fails hard when a cafile path does not exist, which breaks
# `bun install` on CI runners and any machine without that exact path.
# On a proxied machine, set the cafile in the per-user ~/.bunfig.toml instead:
#
#   [install]
#   cafile = "/opt/homebrew/etc/ca-certificates/cert.pem"
