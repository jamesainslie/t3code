name: Auto retry

# GitHub-hosted runner VMs intermittently die mid-job with a shutdown signal
# (observed repeatedly during bun install on both 24.04 and 22.04 images).
# Step-level retries cannot survive the VM dying, so failed runs of CI and
# Release get their failed jobs re-run automatically, bounded to two retries.
# Genuine failures still fail; they just fail up to two extra times.
on:
  workflow_run:
    workflows: ["CI", "Release"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Rerun failed jobs
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-22.04
    steps:
      - name: Rerun failed jobs of ${{ github.event.workflow_run.name }} run ${{ github.event.workflow_run.id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
