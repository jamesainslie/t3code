name: Auto retry

# GitHub-hosted runner VMs intermittently die mid-job (observed repeatedly
# during bun install and browser tests, on both 24.04 and 22.04 images).
# Depending on how the VM dies, GitHub reports the run as a failure
# (shutdown signal, exit 143) or as cancelled (the operation was canceled),
# so both conclusions are retried. Step-level retries cannot survive the VM
# dying, so failed jobs are re-run at the workflow level, bounded to two
# retries. Genuine failures still fail, and an intentionally cancelled run
# is resurrected at most twice before staying dead.
on:
  workflow_run:
    workflows: ["CI", "Release"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Rerun failed jobs
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-22.04
    steps:
      - name: Rerun failed jobs of ${{ github.event.workflow_run.name }} run ${{ github.event.workflow_run.id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
